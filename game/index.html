<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emberwake — a lantern-warden survival</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0918;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      border-radius: 6px;
      box-shadow: 0 0 90px rgba(255, 150, 60, 0.10), 0 0 0 1px rgba(157, 148, 196, 0.16);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720" aria-label="Emberwake game canvas"></canvas>
  <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
